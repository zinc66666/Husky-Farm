<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Husky Farm Ads</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            background-color: #0f111a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1a1d2e;
            border: 1px solid #2a2f45;
            border-radius: 16px;
            padding: 24px;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .loader {
            border: 4px solid #2a2f45;
            border-top: 4px solid #4e9af1;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px; font-size: 18px; color: #fff; }
        p { margin: 0; font-size: 14px; color: #8e95ad; line-height: 1.4; }
        .timer { font-size: 22px; font-weight: bold; color: #4e9af1; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="loader"></div>
        <h2 id="title">Спонсорский блок</h2>
        <p id="desc">Показ рекламы... Пожалуйста, подождите завершения.</p>
        <div class="timer" id="timer"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let rewarded = false;

        function completeView() {
            if (rewarded) return;
            rewarded = true;
            tg.sendData("ad_completed");
        }

        function runFallbackTimer() {
            let seconds = 6;
            const timerEl = document.getElementById("timer");
            const descEl = document.getElementById("desc");
            descEl.innerText = "Спонсорский показ активен. Начисление через:";
            timerEl.innerText = `${seconds} сек`;

            const interval = setInterval(() => {
                seconds--;
                if (seconds > 0) {
                    timerEl.innerText = `${seconds} сек`;
                } else {
                    clearInterval(interval);
                    timerEl.innerText = "Готово! 🎉";
                    setTimeout(completeView, 600);
                }
            }, 1000);
        }

        try {
            // Инициализация AdsGram блока
            const AdController = window.Adsgram.init({ blockId: "42940" });
            
            AdController.show()
                .then((result) => {
                    // Успешный просмотр видео AdsGram
                    completeView();
                })
                .catch((err) => {
                    // Если у AdsGram нет видео (no fill / ошибка сети) — включаем таймер, чтобы окно не хлопало
                    console.log("AdsGram fallback:", err);
                    runFallbackTimer();
                });
        } catch (e) {
            runFallbackTimer();
        }
    </script>
</body>
</html>
